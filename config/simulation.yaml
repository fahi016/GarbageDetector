simulator:
  timestep: 0.0041667          # 240 Hz physics
  gravity: -9.81
  gui: true
  realtime: true
  camera_render_hz: 8
  control_hz: 30
  max_mission_seconds: 900
  collect_limit: 0             # 0 = collect all waste


camera:
  width: 640
  height: 480
  fov_deg: 70.0
  near: 0.08
  far: 12.0
  # Camera is mounted on the robot mast and looks slightly downward.
  pitch_deg: -28.0
  yaw_offset_deg: 0.0

robot:
  start_xy: [0.0, 0.0]
  start_yaw_deg: 0.0
  wheel_radius: 0.08
  track_width: 0.42
  max_linear_speed: 0.55
  max_angular_speed: 1.2
  approach_distance: 0.50      # stop this far from waste before arm use
  goal_xy_tolerance: 0.12
  goal_yaw_tolerance_deg: 12.0
  lidar_rays: 36
  lidar_range: 4.0
  obstacle_inflate: 0.45

arm:
  home_joints: [0.0, -0.55, 1.35, 0.0, 0.55, 0.0]
  pregrasp_height: 0.22
  grasp_height: 0.07
  lift_height: 0.32
  ik_max_iterations: 180
  move_timeout: 4.0
  gripper_open: 0.04
  gripper_closed: 0.0
  grasp_attach_distance: 0.22

detector:
  backend: gemini              # gemini | mock | existing | oracle
  confidence_threshold: 0.50
  gemini_model: gemini-3.6-flash
  gemini_scan_interval: 4.0
  gemini_jpeg_quality: 80
  model_path: models/waste_detector.pt
  class_names:
    - plastic_bottle
    - can
    - plastic_bag
    - cardboard
    - food_container
  existing_model_module: null  # e.g. my_project.detector:WasteModel
  existing_model_fn: detect

world:
  size: 16.0
  seed: 7
  waste_count: 10

metrics:
  output_dir: outputs
